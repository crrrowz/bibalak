name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch or tag cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Security audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2026-0194/0195: quick-xml DoS advisories (quadratic-time
          # attribute check / unbounded namespace allocation), pulled in
          # transitively via tauri-utils -> plist (macOS bundling only,
          # never parses untrusted input at runtime). See .cargo/audit.toml.
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195

  web:
    name: Web (lint, types, test, build, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Keep on current LTS (Node 26).
    strategy:
      fail-fast: false
      matrix:
        node-version: [26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No signing secrets in the repository
        run: |
          if git ls-files | grep -Ei '(^|/)(updater\.key|updater\.password|.*\.pfx|.*\.p12|\.env)$|\.keepsake-signing/'; then
            echo "::error::Signing secrets are tracked by git. Remove them and rotate the key (see RELEASING.md)."
            exit 1
          fi
          # Tauri private keys are base64 text starting with the encoding of
          # "untrusted comment: rsign encrypted secret key" (public keys differ).
          if git grep -lI -e "dW50cnVzdGVkIGNvbW1lbnQ6IHJzaWduIGVuY3J5" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::A minisign/Tauri private key was found in the repository."
            exit 1
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      # The frontend imports types generated by ts-rs; regenerate before checks.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test -p bibalak-core
      - name: Check generated IPC types are up to date
        run: git diff --exit-code packages/ipc-types
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ts
      - run: pnpm fmt:check
      - run: pnpm --filter @bibalak/desktop build
      - run: pnpm test:ts
      - name: npm security audit
        run: pnpm audit --audit-level=high

  e2e:
    name: E2E smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only run on main branch pushes (not every PR) to save CI minutes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xvfb
          # WebKitWebDriver for tauri-driver: Ubuntu 26.04 renamed the package
          # from webkit2gtk-driver to webkitgtk-webdriver; install whichever
          # this runner image has.
          if apt-cache show webkitgtk-webdriver >/dev/null 2>&1; then
            sudo apt-get install -y webkitgtk-webdriver
          else
            sudo apt-get install -y webkit2gtk-driver
          fi
          command -v WebKitWebDriver
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: pnpm install --frozen-lockfile
      - name: Build Tauri app (release)
        run: pnpm --filter @bibalak/desktop tauri build
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked --version 2.1.0
      - name: Install E2E deps
        working-directory: apps/desktop/test-e2e
        run: pnpm install --frozen-lockfile
      - name: Start tauri-driver and run E2E smoke suite
        run: |
          xvfb-run tauri-driver &
          sleep 2
          cd apps/desktop/test-e2e && pnpm wdio run wdio.conf.ts

  windows:
    name: Windows (tests, build, card-sandbox probe)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [rust, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: pnpm install --frozen-lockfile
      - name: Rust tests (Windows)
        run: cargo test --workspace
      - name: Frontend tests (Windows)
        run: pnpm test:ts
      - name: Build the app (debug, no installer, DevTools port for the probe)
        shell: pwsh
        run: |
          # The runner's WebView2 ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS,
          # so the test build passes the DevTools port through the window's
          # additionalBrowserArgs (which replaces Tauri's defaults — keep them).
          $conf = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $win = $conf.app.windows[0]
          $win | Add-Member -NotePropertyName additionalBrowserArgs -Force -NotePropertyValue `
            "--remote-debugging-port=9333 --disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection"
          $ci = Join-Path $env:RUNNER_TEMP "tauri.ci.conf.json"
          @{ app = @{ windows = @($win) } } | ConvertTo-Json -Depth 10 | Set-Content -Path $ci -Encoding utf8NoBOM
          pnpm --filter @bibalak/desktop tauri build --debug --no-bundle --config $ci
      - name: WebView2 runtime version
        shell: pwsh
        run: |
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          )
          $found = $keys | Where-Object { Test-Path $_ } | ForEach-Object { (Get-ItemProperty $_).pv }
          if ($found) { Write-Host "WebView2 runtime: $found" } else { Write-Host "::warning::WebView2 runtime not found in registry" }
      - name: Card-sandbox probe against the real WebView2 (ADR-004)
        shell: pwsh
        run: |
          # First WebView2 start on a fresh runner can be slow.
          $env:PROBE_TIMEOUT_MS = "240000"
          $env:RUST_BACKTRACE = "1"
          $out = Join-Path $env:RUNNER_TEMP "app-stdout.txt"
          $err = Join-Path $env:RUNNER_TEMP "app-stderr.txt"
          $app = Start-Process -FilePath "target\debug\desktop.exe" -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $ok = $false
          try {
            node apps/desktop/test-e2e/sandbox-probe.mjs 9333
            $ok = ($LASTEXITCODE -eq 0)
          } finally {
            if (-not $ok) {
              Write-Host "::group::Diagnostics"
              Write-Host "App exited: $($app.HasExited) $(if ($app.HasExited) { "code " + $app.ExitCode })"
              Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Select-Object Id, StartTime | Format-Table | Out-String | Write-Host
              Get-NetTCPConnection -LocalPort 9333 -ErrorAction SilentlyContinue | Format-Table | Out-String | Write-Host
              foreach ($f in @($out, $err, (Join-Path $env:TEMP "bibalak-crash.txt"))) {
                if (Test-Path $f) { Write-Host "--- $f"; Get-Content $f -Tail 60 | Write-Host }
              }
              Write-Host "::endgroup::"
            }
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
          if (-not $ok) { throw "sandbox probe failed" }

  macos:
    name: macOS (tests, debug build)
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [rust, web]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: pnpm install --frozen-lockfile
      - name: Rust tests (macOS)
        run: cargo test --workspace
      - name: Frontend tests (macOS)
        run: pnpm test:ts
      - name: Build the app (debug, no bundle)
        run: pnpm --filter @bibalak/desktop tauri build --debug --no-bundle

  licenses:
    name: Licenses (THIRD_PARTY_NOTICES.md)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.3 --features cli
      - name: Licence script tests
        run: node --test scripts/licenses/generate-notices.test.mjs
      - name: Release script tests (update source, latest.json)
        run: node --test scripts/release/release-scripts.test.mjs scripts/release/bump-version.test.mjs
      - name: Check THIRD_PARTY_NOTICES.md and licence allowlist
        run: node scripts/licenses/generate-notices.mjs --check
