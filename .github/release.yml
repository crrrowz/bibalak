changelog:
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Features
      labels:
        - feat
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - fix
        - bug
    - title: Security
      labels:
        - security
    - title: Arabic & Localization
      labels:
        - i18n
        - arabic
        - l10n
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Maintenance & Dependencies
      labels:
        - chore
        - ci
        - dependencies
    - title: Other Changes
      labels:
        - "*"
