[package]
name = "desktop"
description = "Bibalak desktop shell (Tauri). Thin adapter: registers IPC commands that delegate to bibalak-core."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix keeps the lib name unique from the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

# Bibalak core engine + adapters. The shell never contains domain logic; it
# only (de)serialises, opens the collection, and delegates.
bibalak-core.workspace = true
bibalak-db.workspace = true
bibalak-ankifmt.workspace = true
bibalak-scheduler.workspace = true
bibalak-render.workspace = true
bibalak-search.workspace = true
bibalak-media.workspace = true
bibalak-plugin.workspace = true
bibalak-ai.workspace = true
